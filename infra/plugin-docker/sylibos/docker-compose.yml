# Assumes Hub/ layout: ORDECK/ and SylibOS/ are siblings
services:
  sylibos-plugin:
    build:
      context: ../../
      dockerfile: docker/sylibos/Dockerfile.plugin
    container_name: ordeck-sylibos-plugin
    restart: unless-stopped
    ports:
      - "3005:80"
    networks:
      - ordeck-net

  sylibos-api:
    build:
      context: ../../../SylibOS/backend
    container_name: ordeck-sylibos-api
    restart: unless-stopped
    ports:
      - "8004:8004"
    volumes:
      - ${SYLIBOS_DATA_PATH:-/mnt/Luna/Backends/SylibOS-Data}:/data
    env_file: .env
    environment:
      - PORT=8004
      - DB_PATH=/data/sylibos.db
      - SHELL_URL=${SHELL_URL:-https://jkos.net}
      - NIGHTLY_CRON=${NIGHTLY_CRON:-0 2 * * *}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - LAZUROS_URL=${LAZUROS_URL:-http://host.docker.internal:8080}
      - LAZUROS_TOKEN=${LAZUROS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ordeck-net

networks:
  ordeck-net:
    external: true
