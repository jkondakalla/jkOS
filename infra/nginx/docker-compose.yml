# Standalone nginx — reverse proxy for prod and staging subdomains.
#
# Start prod services first (they join jkos-internal as external):
#   cd jkAuth      && docker compose up -d --build
#   cd BeigeBoard  && docker compose up -d --build
#   cd SylibOS     && docker compose up -d --build
#   cd infra/nginx && docker compose up -d
#
# Staging services join nginx-staging-proxy (created here) when brought up:
#   cd jkAuth      && docker compose -f docker-compose.staging.yml up -d --build
#   cd BeigeBoard  && docker compose -f docker-compose.staging.yml up -d --build
#   cd SylibOS     && docker compose -f docker-compose.staging.yml up -d --build

services:
  standalone-nginx:
    build: .
    container_name: standalone-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./standalone.conf:/etc/nginx/nginx.conf:ro
      # The Weave same-origin peer-proxy includes, referenced by standalone.conf via
      # `include /etc/nginx/weave-proxy.conf` (prod blocks) and
      # `include /etc/nginx/weave-proxy-staging.conf` (staging block). Both are
      # generated by gen-nginx-weave.mjs and MUST be mounted or nginx won't start.
      - ./weave-proxy.conf:/etc/nginx/weave-proxy.conf:ro
      - ./weave-proxy-staging.conf:/etc/nginx/weave-proxy-staging.conf:ro
      # The generated per-app server blocks (prod origins) + staging subpaths, for apps
      # added with edge:'standard' (`pnpm new-app`). Also generated by gen-nginx-weave.mjs
      # and `include`d by standalone.conf — MUST be mounted (empty until the first such
      # app, but the include is unconditional). Adding an edge app needs no mount change;
      # adding a NEW include file does — recreate nginx (`docker compose up -d`) to add it.
      - ./apps-generated.conf:/etc/nginx/apps-generated.conf:ro
      - ./apps-generated-staging.conf:/etc/nginx/apps-generated-staging.conf:ro
      - ${SSL_PATH:-/mnt/Luna/Backends/ssl}:/etc/nginx/ssl:ro
      - ${NGINX_LOGS_PATH:-/mnt/Luna/Backends/Production/nginx-logs}:/var/log/nginx
    networks:
      - jkos-internal
      - nginx-staging-proxy
    # LazurOS runs on the host network (WoL needs raw LAN broadcast) — give
    # nginx a route to it for the /api/lazuros/ location on jkos.net.
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  # All prod services join this network (created here so nginx is always the owner).
  jkos-internal:
    name: jkos-internal
  # Staging services join this when their compose.staging.yml is brought up.
  nginx-staging-proxy:
    name: nginx-staging-proxy
