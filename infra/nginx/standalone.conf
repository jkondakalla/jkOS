# Standalone reverse proxy for all *.jkos.net services.
#
# Container name:  standalone-nginx
# Networks joined: jkos-internal      (prod services: ordeck-shell, bb-app, sylibos-*, jkos-auth)
#                  nginx-staging-proxy (staging services: staging-*, jkos-deploy)
# Both networks are created by infra/nginx/docker-compose.yml.
#
# SSL: Cloudflare Origin Certificate (wildcard *.jkos.net + jkos.net, 15-year validity).
# Stored on host at /mnt/Luna/Backends/ssl, mounted read-only as /etc/nginx/ssl.
# No certbot or renewal cron needed.
#   /etc/nginx/ssl/cert.pem   (host: cert.pem, 644)
#   /etc/nginx/ssl/key.pem    (host: key.pem,  600)
#
# ── Adding a new PROD service ─────────────────────────────────────────────────
# 1. Service docker-compose.yml joins jkos-internal (external).
# 2. Add it to the root docker-compose.yml include list.
# 3. Add a server block below (copy the BeigeBoard block as template); it should
#    `include /etc/nginx/weave-proxy.conf;` so it reaches every suite peer.
# 4. If the new app exposes an API/health for peers, add its /api/<id>/ + /health/<id>
#    block to weave-proxy.conf (or regenerate it: node infra/nginx/gen-nginx-weave.mjs)
#    and seed its app_registry row in jkAuth. Restart nginx (NOT reload — both confs
#    are bind-mounts; jkos-deploy restarts).
# 5. Add DNS record in Cloudflare.
#
# Same-origin Weave transport: every prod origin includes weave-proxy.conf, so any
# app frontend reaches any peer same-origin (cookie flows, no CORS). The peer
# backends still enforce their own JWT (aud/scope) — that is the authorization gate.
#
# ── Adding a new STAGING service ─────────────────────────────────────────────
# 1. Service docker-compose.staging.yml joins nginx-staging-proxy (external).
#    Container name must be staging-<name>.
# 2. Add a location block in the staging server block below.
#    Copy an existing location block — set $upstream + rewrite + auth_request.
# 3. Add root docker-compose.staging.yml include entry.
# 4. Update the staging git repo on TrueNAS and run: docker compose -f docker-compose.staging.yml up -d --build

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    tcp_nopush on;
    gzip       on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # All traffic arrives via Cloudflare. Trust CF-Connecting-IP from Cloudflare edge IPs
    # so $remote_addr becomes the real visitor IP for rate limiting and access logs.
    # Cloudflare IPv4 ranges — keep in sync with https://www.cloudflare.com/ips/
    real_ip_header    CF-Connecting-IP;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    # Cloudflare IPv6 ranges
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/32;

    # Docker's internal DNS — required for variable-based proxy_pass (staging).
    # Upstreams resolved at request time so nginx starts even when staging is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name jkos.net beigeboard.jkos.net sylibos.jkos.net auth.jkos.net staging.jkos.net;
        return 301 https://$host$request_uri;
    }

    # ── ORDECK (jkOS Portal) ──────────────────────────────────────────────────
    # Static React SPA served by ordeck-shell (nginx:alpine).
    # This is the public entry point to the jkOS suite at jkos.net.
    server {
        listen 443 ssl http2;
        server_name jkos.net;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 2m;

        # ── Weave same-origin peer proxy (same-origin so the jkos_token cookie
        # flows) ── The /api/<peer>/* + /health/<peer> + LazurOS routes by which
        # this origin reaches every suite peer. Shared across all prod origins via
        # the include, so the portal AND each app frontend reach peers the same
        # way; each backend still enforces its own JWT (not auth_request-gated).
        include /etc/nginx/weave-proxy.conf;

        location / {
            set $upstream      http://ordeck-shell:80;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── BeigeBoard ────────────────────────────────────────────────────────────
    # All traffic (frontend SPA + /api/*) is handled by a single Node process.
    # No path prefix stripping needed — BeigeBoard routes are at root.
    server {
        listen 443 ssl http2;
        server_name beigeboard.jkos.net;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 10m;

        # Weave same-origin peer proxy: lets BeigeBoard's frontend reach SylibOS /
        # jkAuth / LazurOS same-origin. More-specific than `location /`, so its own
        # SPA + /api/* still fall through below.
        include /etc/nginx/weave-proxy.conf;

        location / {
            set $upstream      http://bb-app:3001;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # ── jkOS Auth ─────────────────────────────────────────────────────────────
    # Login portal and SSO service for all *.jkos.net apps.
    # SSL: Cloudflare Origin Certificate wildcard covers auth.jkos.net automatically.
    server {
        listen 443 ssl http2;
        server_name auth.jkos.net;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 2m;

        # Weave same-origin peer proxy (symmetry — every origin reaches every peer).
        include /etc/nginx/weave-proxy.conf;

        location / {
            set $upstream      http://jkos-auth:3100;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # ── SylibOS ───────────────────────────────────────────────────────────────
    # Frontend SPA served by sylibos-frontend (nginx:alpine).
    # Backend API served by sylibos-api (Node.js) at /api/* and /health.
    server {
        listen 443 ssl http2;
        server_name sylibos.jkos.net;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ZIP course imports can be large
        client_max_body_size 512m;

        # Weave same-origin peer proxy. /api/bb/ + /api/sylib/ + /health/* are
        # more-specific than this origin's own `location /api/` + `location /health`
        # below, so SylibOS's own routing is unchanged; this only ADDS peer reach
        # (no SylibOS app change). Lets a SylibOS page call BeigeBoard same-origin.
        include /etc/nginx/weave-proxy.conf;

        # Backend API — SylibOS API routes are at /api/*
        location /api/ {
            set $upstream      http://sylibos-api:8004;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Health endpoint on the backend
        location /health {
            set $upstream      http://sylibos-api:8004;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Frontend SPA — served by sylibos-frontend nginx with try_files fallback
        location / {
            set $upstream      http://sylibos-frontend:80;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Staging ────────────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name staging.jkos.net;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 512m;

        # Internal subrequest target for auth_request — proxies to STAGING auth for
        # the admin check. Staging auth reads jkos_token_staging (JKOS_COOKIE_SUFFIX)
        # and verifies issuer jkos-auth-staging, so the gate is fully isolated from
        # prod: a prod session grants nothing here, and vice versa.
        location = /_auth_admin_check {
            internal;
            set $auth_upstream     http://staging-jkos-auth:3100;
            proxy_pass             $auth_upstream/auth/require-admin;
            proxy_pass_request_body off;
            proxy_set_header       Content-Length  "";
            proxy_set_header       Cookie          $http_cookie;
            proxy_set_header       X-Original-URI  $request_uri;
        }

        # Unauthenticated → staging's OWN login portal (not prod auth.jkos.net),
        # so signing in mints a staging cookie scoped to this host.
        location @staging_unauthorized {
            return 302 https://staging.jkos.net/auth/login?redirect_to=https://staging.jkos.net;
        }

        location @staging_forbidden {
            return 403 "Admin access required.\n";
        }

        location @staging_unavailable {
            return 503 "Staging service is not running. Start it via /deploy/\n";
        }

        # ── ORDECK shell HUD data feeds (same-origin, so the staging cookie flows) ──
        # The ORDECK v2 dashboard reads BeigeBoard + SylibOS through these prefixes
        # and probes each service /health, using the SAME absolute paths as prod
        # (the shell image is identical) — here they point at the staging upstreams.
        # Admin-gated like everything else on staging.
        location /api/lazuros/ {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            proxy_pass         http://host.docker.internal:8080/;
            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_read_timeout 600s;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /health/auth {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $hud http://staging-jkos-auth:3100;
            rewrite ^.*$ /health break;
            proxy_pass       $hud;
            proxy_set_header Host $host;
        }
        location = /health/bb {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $hud http://staging-bb-app:3001;
            rewrite ^.*$ /health break;
            proxy_pass       $hud;
            proxy_set_header Host $host;
        }
        location = /health/sylibos {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $hud http://staging-sylibos-api:8004;
            rewrite ^.*$ /health break;
            proxy_pass       $hud;
            proxy_set_header Host $host;
        }
        location /api/bb/ {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $hud http://staging-bb-app:3001;
            rewrite ^/api/bb/(.*)$ /api/$1 break;
            proxy_pass       $hud;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/sylib/ {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $hud http://staging-sylibos-api:8004;
            rewrite ^/api/sylib/(.*)$ /api/$1 break;
            proxy_pass       $hud;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Staging login portal — PUBLIC (like prod auth.jkos.net). This is the
        # sign-in surface itself, so it must NOT be behind the admin gate or you
        # get a redirect loop. The gate still protects every app + the portal
        # root; a non-admin who signs in here just gets a 403 from require-admin.
        # No prefix strip: jkAuth serves its routes under /auth/* already, and the
        # auth client builds https://staging.jkos.net/auth/<route>.
        location /auth/ {
            error_page 502 503 504 = @staging_unavailable;
            set $upstream http://staging-jkos-auth:3100;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # The jkAuth login page links /style.css (served from its public/ at root).
        # Route it to staging auth so the staging sign-in page is styled. Public.
        location = /style.css {
            set $upstream http://staging-jkos-auth:3100;
            proxy_pass         $upstream;
            proxy_set_header   Host $host;
        }

        location /beigeboard/ {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $upstream http://staging-bb-app:3001;
            rewrite ^/beigeboard/(.*) /$1 break;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        location /sylib/api/ {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $upstream http://staging-sylibos-api:8004;
            rewrite ^/sylib/api/(.*) /api/$1 break;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /sylib/health {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $upstream http://staging-sylibos-api:8004;
            rewrite ^/sylib/health /health break;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Deploy controller UI — jkos-deploy on nginx-staging-proxy network.
        # Trailing slash on proxy_pass strips the /deploy prefix before forwarding.
        # proxy_buffering off is required for the SSE log stream (/deploy/logs/stream).
        location /deploy/ {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            set $upstream      http://jkos-deploy:8090;
            rewrite ^/deploy/(.*)$ /$1 break;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Connection        '';
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 600s;
        }

        location /sylib/ {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $upstream http://staging-sylibos-frontend:80;
            rewrite ^/sylib/(.*) /$1 break;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── ORDECK shell (the jkOS portal) — staging root, admin-gated ─────────────
        # Catch-all: mirrors prod jkos.net, where the shell owns the origin root.
        # This replaces the old static landing page now that the real portal runs on
        # staging. Longest-prefix matching means the app subpaths (/auth/, /beigeboard/,
        # /sylib/, /deploy/) and the data feeds above still win; everything else (the
        # SPA shell, its assets, client-side routes) falls through to here. If the
        # shell container is down, @staging_unavailable points the admin at /deploy/.
        location / {
            auth_request /_auth_admin_check;
            error_page 401 = @staging_unauthorized;
            error_page 403 = @staging_forbidden;
            error_page 502 503 504 = @staging_unavailable;
            set $upstream      http://staging-ordeck-shell:80;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
