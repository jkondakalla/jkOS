# PapyrOS — GENERATED from @jkos/suite-manifest APPS (edge:'standard'); do not hand-edit.
server {
    listen 80;
    server_name papyros.jkos.net;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name papyros.jkos.net;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # Weave same-origin peer proxy (every prod origin reaches every peer).
    include /etc/nginx/weave-proxy.conf;

    # Digital Asset Links — GENERATED from infra/nginx/assetlinks.json; do not hand-edit.
    # Answered at the edge because serveSpa's express.static ignores dotfile paths and
    # the SPA fallback would return index.html at 200 (see gen-nginx-weave.mjs).
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        return 200 '[]';
    }

    location / {
        set $upstream      http://papyros-app:3010;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

