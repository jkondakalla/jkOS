# jkOS workspace members. Remaining Python services (services/*, the sylibos worker)
# have no package.json and are skipped by pnpm automatically.
packages:
  - "apps/*"          # ordeck (shell), beigeboard, sylibos, jkauth frontends/services
  - "apps/*/backend"  # beigeboard + sylibos + lazuros node backends
  - "packages/*"      # @jkos/{design,auth-client,auth-middleware,ui,weave,cards,...}
