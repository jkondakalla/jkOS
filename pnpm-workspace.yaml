# jkOS workspace members. Python services (apps/lazuros, services/*) have no
# package.json and are skipped by pnpm automatically.
packages:
  - "apps/*"          # ordeck (shell), beigeboard, sylibos, jkauth frontends/services
  - "apps/*/backend"  # beigeboard + sylibos node backends
  - "packages/*"      # @jkos/{design,auth-client,auth-middleware,types,ui}
  - "plugins/*"       # ORDECK federation microfrontends (not in prod deploy)
