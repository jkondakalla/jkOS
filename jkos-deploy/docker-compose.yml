name: jkos-deploy
services:
  jkos-deploy:
    build: .
    container_name: jkos-deploy
    restart: unless-stopped
    networks:
      - nginx-staging-proxy
    volumes:
      - /mnt/Luna/Webhost:/webhost
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.ssh:/root/.ssh:ro
    env_file: .env
    environment:
      PORT: "8090"
      # Promote = deploy the exact staging commit you just tested. Flip back to
      # "main" to restore a merge-gated release flow.
      PROD_BRANCH: staging
      # jkos-deploy is a staging-environment service: it must verify the staging
      # session cookie (jkos_token_staging) and issuer, not the prod one.
      JKOS_COOKIE_SUFFIX: "_staging"
      JKOS_AUTH_ISSUER: "jkos-auth-staging"
      # Verify by JWKS-over-kid (key rotation) instead of a single static key. Both
      # services are on nginx-staging-proxy, so jkAuth is reachable by container
      # name. jkos_auth.py still falls back to JKOS_AUTH_PUBLIC_KEY (from .env) if
      # this endpoint is briefly unreachable — but with it set, promoting jkAuth's
      # NEXT signing key no longer 401s the console (the latent rotation trap).
      JKOS_AUTH_JWKS_URI: "http://staging-jkos-auth:3100/auth/jwks"
      # The deploy scripts validate the new nginx config in a throwaway container
      # via `docker run -v ...`; those bind-mount sources are resolved by the HOST
      # daemon, so the scripts need host paths. HOST_WEBHOST maps this container's
      # /webhost mount back to its real host location; SSL_PATH is the nginx certs
      # dir on the host. (Both match main.py's defaults — set here for clarity.)
      HOST_WEBHOST: /mnt/Luna/Webhost
      SSL_PATH: /mnt/Luna/Backends/ssl

networks:
  nginx-staging-proxy:
    external: true
