name: jkos-deploy
services:
  jkos-deploy:
    build: .
    container_name: jkos-deploy
    restart: unless-stopped
    networks:
      - nginx-staging-proxy
    volumes:
      - /mnt/Luna/Webhost:/webhost
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.ssh:/root/.ssh:ro
    env_file: .env
    environment:
      PORT: "8090"
      # Promote = deploy the exact staging commit you just tested. Flip back to
      # "main" to restore a merge-gated release flow.
      PROD_BRANCH: staging
      # jkos-deploy is a staging-environment service: it must verify the staging
      # session cookie (jkos_token_staging) and issuer, not the prod one.
      JKOS_COOKIE_SUFFIX: "_staging"
      JKOS_AUTH_ISSUER: "jkos-auth-staging"

networks:
  nginx-staging-proxy:
    external: true
