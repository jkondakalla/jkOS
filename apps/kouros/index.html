<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) return anything
       other than 0. Without it the shell never learns the notch exists, and the
       installed app draws its header underneath the status bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KourOS</title>
  <!-- Installability. Every href here is RELATIVE so vite rewrites it against
       `base` — prod builds at "/" and staging at "/kouros/", and an absolute
       path would 404 under the second. `theme-color` is the accent, so the
       Android status bar and task-switcher card match the app rather than
       defaulting to white. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#4b3f8f" />
  <meta name="description" content="KourOS is your music library — browse albums and artists, build a queue, and follow the vibe map through the collection." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KourOS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Typography: IBM Plex Mono/Sans + Fraunces — the serif is the suite default
       (--hub-font-serif, Full Press): labels, chips and text buttons are printed,
       so every app loads it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,600;9..144,0,700;9..144,1,400;9..144,1,600&display=swap" rel="stylesheet" />
  <script type="module" src="/src/main.tsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
