name: jkos-staging-kouros
services:
  kouros-app:
    build:
      context: ../..
      dockerfile: apps/kouros/Dockerfile
      args:
        VITE_BASE: /kouros/
        # Origin only — the auth client appends /auth/... itself. A /auth suffix here
        # yields broken /auth/auth/login URLs.
        VITE_JKOS_AUTH_URL: https://staging.jkos.net
        VITE_API_URL: /kouros
    container_name: staging-kouros-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3011"
      DB_PATH: /data/kouros.db
      # Turns ON audience enforcement (C7 / JK-A14 / WV-3): jkAuth mints `aud` from
      # app_registry.allowed_roles, and until this was set NOTHING verified it. One
      # cookie is sent to every *.jkos.net host, so this claim is the containment —
      # it is what stops a token minted for another app being spent here.
      JKOS_APP_ID: kouros
      STATIC_DIR: /app/dist
      # The music library, read-only. The scanner walks this on boot and on every
      # rescanLibrary call; one row per audio file found anywhere beneath it.
      MUSIC_DIR: /music
      # Folder NAMES the scan refuses to enter, at any depth. `Old (Needs to be
      # trimmed)` is the previous artist-nested rip, still living inside the
      # library root — ~15,000 files duplicating the flat re-download beside them.
      # Keep in step with music/config.py's EXCLUDE_DIRS.
      MUSIC_EXCLUDE_DIRS: "Old (Needs to be trimmed)"
      # The music analysis (ALGORITHMS.md §4 and §9) — the CLAP vectors and
      # descriptors behind similarity, radio, Runs and the vibe map, and the
      # pulsarmap meshes. Both OPTIONAL: an absent index degrades every discovery
      # surface to metadata affinity and says so on the wire, and a track with no
      # mesh answers `state: 'pending'`. A quieter app, never a broken one.
      #
      # Produced on the workstation by `music/analyze.py` and DELIVERED here by its
      # restricted push key (infra/music-analysis/README.md): two single-file
      # `VACUUM INTO` snapshots with no -wal sidecar, verified before they leave,
      # replaced by rename so this app never opens a torn file. KourOS notices a
      # replacement within its discovery TTL, reloads, and rescans the library for
      # the music the new analysis describes — no restart, no copy by hand.
      VECTOR_DB_PATH: /analysis/music-index.db
      MESH_DB_PATH: /analysis/music-meshes.db
      # The directory name the embedder's paths are rooted at. Used to recover an
      # artist/title key when the index was built against a DIFFERENT library
      # layout — see backend/src/discover/vectors.js. Matches the last segment of
      # the real library path — `Music` either way, since the workstation spells it
      # /mnt/Luna/Plex/Music and the HOST spells it /mnt/Luna/Luna/Plex/Music. This
      # comment used to cite the workstation path while saying "on the host": the
      # exact confusion the volume note below exists to prevent, in the file that
      # prevents it. The VALUE was never wrong; the sentence was.
      LIBRARY_ROOT_NAME: Music
      # The audiobook library — PapyrOS's, since PapyrOS folded into KourOS
      # (2026-09-23). One book per immediate subfolder, walked AFTER the music on
      # boot and on every rescanLibrary.
      AUDIOBOOKS_DIR: /audiobooks
      # After every book scan: enrich sparse tags from iTunes (src/books/match.js),
      # and pre-generate the Firefox-safe lossless remux of every book file
      # (src/books/media.js). PapyrOS ran both as PAPYROS_AUTO_ENRICH/_COMPAT.
      KOUROS_BOOKS_AUTO_ENRICH: "1"
      KOUROS_BOOKS_AUTO_COMPAT: "1"
      JKOS_AUTH_URL: https://staging.jkos.net
      SHELL_URL: https://staging.jkos.net
      JKOS_COOKIE_SUFFIX: "_staging"
      JKOS_AUTH_ISSUER: "jkos-auth-staging"
    volumes:
      - ${KOUROS_DATA_PATH:-/mnt/Luna/Backends/Staging/kouros-data}:/data
      # The library itself, READ-ONLY — this app scans and streams it, and must
      # never be able to write to it. Override the host path with MUSIC_PATH.
      #
      # ⚠️ **THIS IS THE HOST'S PATH, NOT THE WORKSTATION'S.** The CIFS share
      # `//192.168.1.108/Luna` mounts at `/mnt/Luna` on a workstation, but on the
      # TrueNAS host itself it is the dataset at `/mnt/Luna/Luna` — so the library
      # is `/mnt/Luna/Luna/Plex/Music` here and the workstation's spelling,
      # `/mnt/Luna/Plex/Music`, is a DIFFERENT and empty directory.
      #
      # That is how KourOS shipped with MUSIC_DIR correctly set and still showed
      # an empty library: docker AUTO-CREATES a missing bind source as an empty
      # directory rather than failing, so the wrong path mounted cleanly, the
      # scanner walked it, found nothing, and reported success. There is no error
      # anywhere in that chain — which is why the path is spelled out here rather
      # than left to a default someone reads past.
      - ${MUSIC_PATH:-/mnt/Luna/Luna/Plex/Music}:/music:ro
      # The analysis, READ-ONLY, shared by production and staging — it describes
      # one library, so there is one copy. Its own dataset (`Luna/jkos-analysis`)
      # for two reasons, both measured: `Luna/Backends` is snapshotted hourly and
      # kept 30 days, which would pin ~1 GB per delivery for a month of a file that
      # is regenerable by definition; and the delivery key's rrsync restriction
      # is confined here, a dataset that holds no application database at all.
      #
      # ⚠️ Create it BEFORE deploying (runbook, step 1). Docker auto-creates a
      # missing bind source as an empty ROOT-owned directory, which mounts cleanly,
      # serves nothing, and refuses the delivery key's writes.
      #
      # ⚠️ HOST path. The workstation mounts the `Luna/Luna` SMB share at /mnt/Luna,
      # so `/mnt/Luna/jkos-analysis` there is a different (nonexistent) directory.
      - ${MUSIC_ANALYSIS_PATH:-/mnt/Luna/jkos-analysis}:/analysis:ro
      # The audiobooks, READ-ONLY — PapyrOS's mount, unchanged. The same HOST-path
      # warning as the music above applies: `/mnt/Luna/Luna/...` on the NAS.
      # Override with AUDIOBOOKS_PATH.
      - ${AUDIOBOOKS_PATH:-/mnt/Luna/Luna/Plex/Audiobooks}:/audiobooks:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-staging-proxy

networks:
  nginx-staging-proxy:
    external: true
    name: nginx-staging-proxy
