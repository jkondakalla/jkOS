name: jkos-staging-kouros
services:
  kouros-app:
    build:
      context: ../..
      dockerfile: apps/kouros/Dockerfile
      args:
        VITE_BASE: /kouros/
        # Origin only — the auth client appends /auth/... itself. A /auth suffix here
        # yields broken /auth/auth/login URLs.
        VITE_JKOS_AUTH_URL: https://staging.jkos.net
        VITE_API_URL: /kouros
    container_name: staging-kouros-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3011"
      DB_PATH: /data/kouros.db
      STATIC_DIR: /app/dist
      JKOS_AUTH_URL: https://staging.jkos.net
      SHELL_URL: https://staging.jkos.net
      JKOS_COOKIE_SUFFIX: "_staging"
      JKOS_AUTH_ISSUER: "jkos-auth-staging"
    volumes:
      - ${KOUROS_DATA_PATH:-/mnt/Luna/Backends/Staging/kouros-data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-staging-proxy

networks:
  nginx-staging-proxy:
    external: true
    name: nginx-staging-proxy
