name: jkos-staging-bb
services:
  bb-app:
    build:
      context: ../..
      dockerfile: apps/beigeboard/Dockerfile
      args:
        VITE_BASE: /beigeboard/
        # Origin only — the auth client appends /auth/... itself. A /auth suffix
        # here yields broken /auth/auth/login URLs.
        VITE_JKOS_AUTH_URL: https://staging.jkos.net
        VITE_API_URL: /beigeboard
    container_name: staging-bb-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      DB_PATH: /data/beigeBoard.db
      STATIC_DIR: /app/dist
      SHELL_URL: https://staging.jkos.net
      JKOS_COOKIE_SUFFIX: "_staging"
      JKOS_AUTH_ISSUER: "jkos-auth-staging"
      # Encrypts calendar OAuth refresh tokens + iCloud app password at rest (AES-256-GCM).
      # Supply via .env (openssl rand -hex 32). Unset → plaintext (safe no-op). See OPERATIONS.md.
      CALENDAR_ENC_KEY: ${CALENDAR_ENC_KEY:-}
    volumes:
      - ${BEIGEBOARD_DATA_PATH:-/mnt/Luna/Backends/Staging/beigeboard-data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-staging-proxy

networks:
  nginx-staging-proxy:
    external: true
    name: nginx-staging-proxy
