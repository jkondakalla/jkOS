name: jkos-prod-papyros
services:
  papyros-app:
    build:
      context: ../..
      dockerfile: apps/papyros/Dockerfile
    container_name: papyros-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3010"
      DB_PATH: /data/papyros.db
      # Turns ON audience enforcement (C7 / JK-A14 / WV-3): jkAuth mints `aud` from
      # app_registry.allowed_roles, and until this was set NOTHING verified it. One
      # cookie is sent to every *.jkos.net host, so this claim is the containment —
      # it is what stops a token minted for another app being spent here.
      JKOS_APP_ID: papyros
      STATIC_DIR: /app/dist
      AUDIOBOOKS_DIR: /audiobooks
      # Auto-run the metadata enrichment sweep after every scan (boot + rescan).
      PAPYROS_AUTO_ENRICH: "1"
      # Pre-generate Firefox-safe lossless remux variants for every file after scans.
      PAPYROS_AUTO_COMPAT: "1"
    volumes:
      - ${PAPYROS_DATA_PATH:-/mnt/Luna/Backends/Production/papyros-data}:/data
      - /mnt/Luna/Luna/Plex/Audiobooks:/audiobooks:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jkos-internal

networks:
  jkos-internal:
    external: true
    name: jkos-internal
