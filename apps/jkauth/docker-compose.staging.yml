name: jkos-staging-auth
services:
  jkos-auth:
    build:
      context: ../..
      dockerfile: apps/jkauth/Dockerfile
    container_name: staging-jkos-auth
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3100"
      DB_PATH: /data/jkos-auth.db
      AUTH_ORIGIN: https://staging.jkos.net
      PORTAL_URL: https://staging.jkos.net
      # Google OAuth callback must target the staging origin — without this it
      # falls back to the localhost default in server.js and "Continue with
      # Google" breaks. This exact URL must ALSO be registered as an Authorized
      # redirect URI on the staging OAuth client in the Google Cloud console.
      GOOGLE_REDIRECT_URI: https://staging.jkos.net/auth/google/callback
      # Host-scoped cookie + distinct name + distinct issuer = full isolation from
      # prod. The prod jkos_token (on .jkos.net) is also sent to staging.jkos.net,
      # so the staging cookie MUST have a different name or they collide.
      COOKIE_DOMAIN: "staging.jkos.net"
      JKOS_COOKIE_SUFFIX: "_staging"
      JKOS_AUTH_ISSUER: "jkos-auth-staging"
    volumes:
      - ${JKOS_AUTH_DATA_PATH:-/mnt/Luna/Backends/Staging/jkos-auth-data}:/data
    networks:
      - nginx-staging-proxy

networks:
  nginx-staging-proxy:
    external: true
    name: nginx-staging-proxy
