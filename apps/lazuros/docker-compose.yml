name: jkos-prod-lazuros
services:
  lazuros:
    build:
      # ROOT context so the pnpm workspace (@jkos/*) resolves — never a per-app
      # context. The Dockerfile lives at apps/lazuros/Dockerfile.
      context: ../..
      dockerfile: apps/lazuros/Dockerfile
    container_name: lazuros
    restart: unless-stopped
    # network_mode: host lets the container broadcast raw WoL magic packets on the
    # LAN (createWolBackend) without macvlan/relay routing. nginx reaches this service
    # at host.docker.internal:8080 (the lazuros peer block) via its own host-gateway.
    network_mode: host
    env_file:
      - .env
    volumes:
      - ${LAZUROS_DATA_PATH:-/mnt/Luna/Backends/Production/lazuros-data}:/data
      # The filled-in deployment config is MOUNTED, not baked into the image — this is
      # what makes the same image run any self-hoster's hardware. Copy a template
      # (deployment.example.json / deployment.jag.json) to deployment.json and fill it in.
      - ./deployment.json:/app/deployment.json:ro
