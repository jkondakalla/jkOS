# ORDECK shell — the static SPA container behind jkos.net / staging.jkos.net.
#
# The nginx dialect of the suite's shared SPA rule; the Express half lives in
# @jkos/weave/server/spa.js (serveSpa) and carries the full account of why. The
# short version: index.html is the only file that knows the current content
# hashes, so if a browser is allowed to reuse an old copy it will ask for assets
# this container no longer has — and a blanket `try_files … /index.html` answers
# each one with the HTML shell at 200. The browser refuses an HTML "module",
# renders nothing, and the page is blank under a correct <title> with no error
# anywhere. That is what took staging.jkos.net's root out on 2026-08-17.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output: safe to keep forever, and a MISS must be a miss.
    # `=404` (not the shell) is the half that keeps a stale entry document loud.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The entry document + client-side routes. `no-cache` still stores and still
    # 304s — it only forbids USING the copy without asking, so a deploy is picked
    # up on the next navigation instead of whenever heuristic freshness lapses.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
