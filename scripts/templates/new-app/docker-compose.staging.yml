name: jkos-staging-__ID__
services:
  __ID__-app:
    build:
      context: ../..
      dockerfile: apps/__ID__/Dockerfile
      args:
        VITE_BASE: /__ID__/
        # Origin only — the auth client appends /auth/... itself. A /auth suffix here
        # yields broken /auth/auth/login URLs.
        VITE_JKOS_AUTH_URL: https://staging.jkos.net
        VITE_API_URL: /__ID__
    container_name: staging-__ID__-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "__PORT__"
      DB_PATH: /data/__DB__
      STATIC_DIR: /app/dist
      JKOS_AUTH_URL: https://staging.jkos.net
      SHELL_URL: https://staging.jkos.net
      JKOS_COOKIE_SUFFIX: "_staging"
      JKOS_AUTH_ISSUER: "jkos-auth-staging"
    volumes:
      - ${__IDUP___DATA_PATH:-/mnt/Luna/Backends/Staging/__ID__-data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-staging-proxy

networks:
  nginx-staging-proxy:
    external: true
    name: nginx-staging-proxy
